<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' https://cdn.tailwindcss.com 'unsafe-inline';">

    <title>Ticketmaster Clone | Mobile Web UI</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* 1. Ticketmaster Primary Blue (BRIGHTER) - #008CFF */
      .tm-primary-blue { color: #008CFF; }
      .tm-bg-primary-blue { background-color: #008CFF; }
      
      /* 2. Ticketmaster Dark Blue - #003B70 (Used for headers and dark accents) */
      .tm-dark-blue { color: #003B70; }
      .tm-bg-dark-blue { background-color: #003B70; } 
      
      /* Primary Button Style (Using Primary Blue #008CFF) */
      .tm-btn { 
          background: #008CFF; 
          color: white; 
          border: none; 
          padding: 12px 24px; 
          border-radius: 44px; 
          font-weight: 600; 
          font-size: 14px; 
          cursor: pointer; 
          transition: background 0.2s ease; 
      }
      .tm-btn:hover { background: #007acb; } 
      
      /* Scroll Container */
      .horizontal-scroll { scroll-snap-type: x mandatory; overflow-x: scroll; -webkit-overflow-scrolling: touch; }
      .scroll-item { scroll-snap-align: start; flex-shrink: 0; }
      
      /* TICKETMASTER Logo (R symbol size) */
      .tm-logo-r { font-size: 0.5em; position: relative; top: -0.5em; vertical-align: super; }

      /* Custom Menu Icon */
      .menu-icon span { display: block; height: 2px; background: white; margin-bottom: 4px; transition: width 0.3s; }
      .menu-icon span:nth-child(1) { width: 24px; }
      .menu-icon span:nth-child(2) { width: 18px; }
      .menu-icon span:nth-child(3) { width: 12px; margin-bottom: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useMemo, useEffect, useRef } = React;

// --- Initial Data (Using HTTPS for all images) ---
const standardBannerRatio = "w=1170&h=640&fit=crop"; 
const initialEvents = [
  // Image URLs updated for reliability
  { id: 1, title: "Taylor Swift | The Eras Tour", artist: "Taylor Swift", date: "2025-03-15", time: "19:30", venue: "SoFi Stadium", location: "Los Angeles, CA", price: 199, category: "music", genre: "Pop", image: `https://images.unsplash.com/photo-1621373507119-21b931e97d19?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1621373507119-21b931e97d19?${standardBannerRatio}`, description: "Experience the magic of Taylor Swift's record-breaking Eras Tour", availableTickets: 150 },
  { id: 2, title: "NBA Finals - Game 7", artist: "NBA", date: "2025-06-20", time: "20:00", venue: "Madison Square Garden", location: "New York, NY", price: 450, category: "sports", genre: "Basketball", image: `https://images.unsplash.com/photo-1546519638-68e109498ffc?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1546519638-68e109498ffc?${standardBannerRatio}`, description: "Witness history as two teams battle for the championship", availableTickets: 200 },
  { id: 3, title: "Hamilton", artist: "Broadway Musical", date: "2025-04-10", time: "20:00", venue: "Richard Rodgers Theatre", location: "New York, NY", price: 175, category: "theater", genre: "Theater", image: `https://images.unsplash.com/photo-1541355415714-38634860b0e5?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1541355415714-38634860b0e5?${standardBannerRatio}`, description: "The revolutionary Broadway musical phenomenon", availableTickets: 100 },
  { id: 4, title: "Coldplay World Tour", artist: "Coldplay", date: "2025-05-22", time: "19:00", venue: "Wembley Stadium", location: "London, UK", price: 125, category: "music", genre: "Rock", image: `https://images.unsplash.com/photo-1506173876985-703358055a40?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1506173876985-703358055a40?${standardBannerRatio}`, description: "Don't miss Coldplay's spectacular world tour", availableTickets: 250 },
  { id: 5, title: "Disney On Ice", artist: "Disney", date: "2025-11-01", time: "14:00", venue: "Staples Center", location: "Los Angeles, CA", price: 50, category: "family", genre: "Ice Show", image: `https://images.unsplash.com/photo-1552554625-78e70a758368?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1552554625-78e70a758368?${standardBannerRatio}`, description: "A magical show for the whole family.", availableTickets: 300 },
  { id: 6, title: "Kevin Hart: Reality Check", artist: "Kevin Hart", date: "2025-09-19", time: "20:30", venue: "The Apollo Theater", location: "New York, NY", price: 90, category: "comedy", genre: "Comedy", image: `https://images.unsplash.com/photo-1510250917631-073c6837130c?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1510250917631-073c6837130c?${standardBannerRatio}`, description: "Non-stop laughs from the comedy superstar.", availableTickets: 70 },
  { id: 7, title: "Inter Miami CF vs LA Galaxy", artist: "MLS", date: "2025-10-10", time: "19:00", venue: "DRV PNK Stadium", location: "Fort Lauderdale, FL", price: 75, category: "sports", genre: "Soccer", image: `https://images.unsplash.com/photo-1563290940-a35948332997?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1563290940-a35948332997?${standardBannerRatio}`, description: "A major clash in the MLS season.", availableTickets: 180 },
  { id: 8, title: "The Lion King Musical", artist: "Broadway Musical", date: "2025-12-05", time: "18:00", venue: "Minskoff Theatre", location: "New York, NY", price: 150, category: "theater", genre: "Musical", image: `https://images.unsplash.com/photo-1541355415714-38634860b0e5?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1541355415714-38634860b0e5?${standardBannerRatio}`, description: "A classic Disney adaptation on stage.", availableTickets: 120 },
  { id: 9, title: "Beyoncé: RENAISSANCE WORLD TOUR", artist: "Beyoncé", date: "2025-07-25", time: "20:00", venue: "MetLife Stadium", location: "East Rutherford, NJ", price: 250, category: "music", genre: "Pop", image: `https://images.unsplash.com/photo-1514525253161-1d4400b8e66a?w=800&h=600&fit=crop`, banner: `https://images.unsplash.com/photo-1514525253161-1d4400b8e66a?${standardBannerRatio}`, description: "The most talked-about tour of the year.", availableTickets: 50 },
  { 
    id: 10, 
    title: "Ariana Grande - The Eternal Sunshine Tour", 
    artist: "Ariana Grande", 
    date: "2026-07-12", 
    time: "20:00", 
    venue: "Barclays Center", 
    location: "Brooklyn, NY", 
    price: 798,
    category: "music", 
    genre: "Pop", 
    image: `https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=800&h=600&fit=crop`, 
    banner: `https://images.unsplash.com/photo-1511379938547-c1f69419868d?${standardBannerRatio}`, 
    description: "The Eternal Sunshine Tour, a massive concert event.", 
    availableTickets: 25,
    isRequested: true
  }
];

// --- Utility Functions (Icons) ---
const Search = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
const Calendar = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>;
const MapPin = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 12v.01"/><path d="M18 10c0 4.5-6 9-6 9s-6-4.5-6-9a6 6 0 0 1 12 0Z"/></svg>;
const ShoppingCart = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.63h9.75a2 2 0 0 0 2-1.63l2.15-10.43H3.21"/></svg>;
const Heart = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3.5 1.02-4.5 2.5C10.95 4.1 9.21 3 7.5 3A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
const ChevronLeft = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
const ChevronRight = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
const TicketIcon = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 9v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M10 7V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v3"/></svg>;
const User = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
const Globe = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/><path d="M12 2v20"/><path d="M2 12h20"/><path d="M14.9 8a5.57 5.57 0 0 0-5.8 0"/><path d="M14.9 16a5.57 5.57 0 0 0-5.8 0"/></svg>;
const HelpCircle = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>;
const LogOut = (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>;


// --- State Management for Navigation and Modals ---
const NavigationPanel = ({ show, onClose, setView, isLoggedIn, setIsLoggedIn }) => {
    if (!show) return null;

    const navItems = [
        { label: "Home", view: "home" },
        { label: "Concerts", view: "home", filter: "music" },
        { label: "Sports", view: "home", filter: "sports" },
        { label: "Arts, Theater & Comedy", view: "home", filter: "theater" },
        { label: "Family", view: "home", filter: "family" },
        { label: "My Events", view: "mytickets" },
        { label: "Favorites", view: "favorites" },
        { label: "Alerts", view: "alerts" },
        { label: "Sell Tickets", view: "sell" },
    ];

    const handleItemClick = (item) => {
        if (item.filter) {
            setView('home', item.filter);
        } else {
            setView(item.view);
        }
        onClose();
    };
    
    const handleLoginToggle = () => {
        setIsLoggedIn(!isLoggedIn);
        onClose();
        alert(isLoggedIn ? "Logged out successfully!" : "Logged in as demo user.");
    }

    return (
        <div className="fixed inset-0 z-[100] flex">
            {/* Nav Content */}
            <div className="w-64 bg-white shadow-2xl overflow-y-auto">
                <div className="p-4 border-b">
                    <button onClick={onClose} className="text-gray-600 hover:text-gray-900 mb-4">
                        <ChevronLeft size={24} />
                    </button>
                    <div className="flex items-center space-x-2">
                        {/* ICON COLOR: Primary Blue */}
                        <User size={24} className="tm-primary-blue" />
                        <span className="text-lg font-bold">My Account</span>
                    </div>
                </div>
                
                <div className="p-4 space-y-2">
                    {navItems.map(item => (
                        <button
                            key={item.label}
                            onClick={() => handleItemClick(item)}
                            className="block w-full text-left py-2 px-1 text-gray-700 hover:bg-gray-100 rounded transition duration-150"
                        >
                            {item.label}
                        </button>
                    ))}
                </div>
                
                <div className="border-t mt-4 p-4 space-y-2">
                    <button onClick={handleLoginToggle} className="flex items-center space-x-3 text-left py-2 px-1 text-gray-700 hover:bg-gray-100 rounded w-full">
                        {/* ICON COLOR: Red or Primary Blue */}
                        {isLoggedIn ? <LogOut size={20} className="text-red-500" /> : <User size={20} className="tm-primary-blue" />}
                        {/* TEXT COLOR: Red or Primary Blue */}
                        <span className={isLoggedIn ? 'text-red-500 font-semibold' : 'tm-primary-blue font-semibold'}>
                            {isLoggedIn ? "Sign Out" : "Sign In"}
                        </span>
                    </button>
                    <div className="flex items-center space-x-3 py-2 px-1 text-gray-700">
                        <Globe size={20} />
                        <span>United States | English</span>
                    </div>
                </div>
            </div>
            
            {/* Overlay to close nav */}
            <div className="flex-1 bg-black bg-opacity-50" onClick={onClose}></div>
        </div>
    );
};

// --- Shared Components ---

// Header (NO STICKY CLASS APPLIED)
const HomeHeader = ({ setView, toggleNav, isLoggedIn }) => (
    <header className="w-full">
        {/* Container for ALL header bars */}
        <div className="tm-bg-dark-blue w-full"> 
            {/* Top Black Bar: Location/Flag */}
            <div className="bg-black p-2 flex justify-between items-center text-white text-xs">
                {/* US Flag Icon with White Circle Border */}
                <div className="flex items-center space-x-1 cursor-pointer border border-white rounded-full p-0.5 hover:bg-gray-800 transition" onClick={() => alert('Country/Region Selector')}>
                    <div className="w-4 h-4 rounded-full overflow-hidden flex items-center justify-center">
                        {/* Flag URL updated for reliable loading */}
                        <img src="https://flagcdn.com/w20/us.png" alt="US Flag" className="w-full h-auto" />
                    </div>
                    <span className="text-white">US</span>
                </div>
            </div>

            {/* Dark Blue Navigation Bar (Primary Nav) - COLOR: #003B70 */}
            <div className="p-3 flex justify-between items-center text-white">
                <div className="flex items-center space-x-4">
                    {/* Menu Button (Three Lines) */}
                    <button onClick={toggleNav} className="p-1">
                        <div className="menu-icon">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </button>
                    
                    {/* TICKETMASTER Logo (FIXED: Small Caps) - Small 't' uses Primary Blue #008CFF */}
                    <div className="flex items-center cursor-pointer" onClick={() => setView('home')}>
                        <div className="tm-bg-primary-blue rounded w-5 h-5 flex items-center justify-center mr-1">
                            <span style={{ color: 'white', fontSize: '14px', fontWeight: 'bold', fontFamily: 'serif' }}>t</span>
                        </div>
                        <h1 className="text-lg font-bold text-white tracking-widest" style={{ textTransform: 'small-caps' }}>
                            Ticketmaster<sup className="tm-logo-r">®</sup>
                        </h1>
                    </div>
                </div>
                
                {/* My Account / Shopping Cart */}
                <div className="flex items-center space-x-4">
                    <button onClick={() => setView('cart')} className="relative p-1">
                        <ShoppingCart size={24} className="text-white" />
                    </button>
                    <button onClick={() => setView('account')} className="p-1">
                        <User size={24} className="text-white" />
                    </button>
                </div>
            </div>
            
            {/* Location/Date Bar - COLOR: #003B70 */}
            <div className="p-2.5 flex justify-between items-center text-white border-t border-gray-700">
                <div className="flex items-center space-x-4 w-full">
                    {/* LOCATION */}
                    <div className="flex items-center space-x-1 flex-1 min-w-0 border border-gray-500 rounded-lg p-1.5 cursor-pointer hover:bg-gray-800 transition" onClick={() => alert('Location Selector')}>
                        <MapPin size={18} className="text-white flex-shrink-0" />
                        <div className="flex flex-col text-left text-sm flex-grow min-w-0">
                            <span className="uppercase text-[10px] font-bold text-gray-400 truncate">LOCATION</span>
                            <span className="font-semibold text-sm truncate">City or Zip Code</span>
                        </div>
                    </div>
                    
                    {/* DATES */}
                    <div className="flex items-center space-x-1 flex-1 min-w-0 border border-gray-500 rounded-lg p-1.5 cursor-pointer hover:bg-gray-800 transition" onClick={() => alert('Dates Selector')}>
                        <Calendar size={18} className="text-white flex-shrink-0" />
                        <div className="flex flex-col text-left text-sm flex-grow min-w-0">
                            <span className="uppercase text-[10px] font-bold text-gray-400 truncate">DATES</span>
                            <span className="font-semibold text-sm truncate">All Dates</span>
                        </div>
                    </div>
                </div>
            </div>

            {/* Search Bar - COLOR: #003B70 */}
            {/* Click here now loads the SearchPage */}
            <div className="p-3 flex justify-center text-white border-t border-gray-700">
                <div 
                    className="w-full bg-white rounded-lg flex items-center p-2 cursor-pointer" 
                    onClick={() => setView('search')}
                >
                    <div className="flex-1 min-w-0 pl-2">
                        <span className="uppercase text-[10px] font-bold text-gray-400 block">SEARCH</span>
                        <div className="flex items-center justify-between">
                            {/* Font size increased slightly (text-base) */}
                            <span className="text-gray-500 text-base truncate">Artist, Event or Venue</span>
                        </div>
                    </div>
                    {/* ICON COLOR: Primary Blue #008CFF */}
                    <Search size={24} className="tm-primary-blue flex-shrink-0" />
                </div>
            </div>
        </div>
    </header>
);

const EventBanner = ({ event, setView, setSelectedEvent, isFeatured = false, isFirstBanner = false }) => (
    <div 
        className={`relative overflow-hidden rounded-lg shadow-lg cursor-pointer h-64 sm:h-80`} // All banners are now large
        onClick={() => { setSelectedEvent(event); setView('detail'); }}
    >
        {/* Use Image URL from event data */}
        <img 
            src={event.banner} 
            alt={event.title} 
            className="w-full h-full object-cover" 
        />
        <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent p-4 flex flex-col justify-end">
            {!isFeatured && <p className="text-white text-sm font-semibold uppercase">{event.genre} Event</p>}
            <h3 className="text-white text-2xl font-bold">{event.title}</h3>
            
            {/* NEW: Small Blue Text Box for the First Banner */}
            {isFirstBanner && (
                <div className="absolute bottom-4 left-4 tm-bg-primary-blue p-2 rounded-lg">
                    <span className="text-white text-base font-semibold">Find Tickets</span>
                </div>
            )}
        </div>
    </div>
);

const SectionSeparator = () => (
    <div className="px-4">
        <hr className="my-8 border-t border-gray-200" />
    </div>
);


// --- Full Page Components ---

const HomePage = ({ events, setView, setSelectedEvent }) => {
    // Content sections based on search results
    const trendingEvent = events.find(e => e.id === 9); 
    // Filter out the trending event and take the next 5 for the vertical list
    const verticalEvents = events.filter(e => e.id !== 9).slice(0, 5); 
    
    // The previous scrollable content categories are now simple placeholders
    const guideItems = ['NFL Tickets', 'NBA Tickets', 'Gift Guide', 'Las Vegas', 'Festivals'];


    return (
        <div className="bg-white min-h-screen pb-20">
            {/* 1. Trending Banner (Top Event - FIXED: Large size and Blue Box) */}
            <div className="p-4"> 
                <EventBanner 
                    event={trendingEvent} 
                    setView={setView} 
                    setSelectedEvent={setSelectedEvent} 
                    isFirstBanner={true}
                />
            </div>
            
            {/* 2. Vertical List of Next 5 Events (FIXED: All Banners are Large) */}
            <div className="space-y-4 px-4">
                {verticalEvents.map(event => (
                    <EventBanner 
                        key={event.id}
                        event={event} 
                        setView={setView} 
                        setSelectedEvent={setSelectedEvent} 
                    />
                ))}
            </div>
            
            {/* 3. Fake Ad Banner */}
            <div className="p-4">
                <div className="bg-orange-500 h-24 rounded-lg shadow-md flex items-center justify-center text-white p-4">
                    <h3 className="text-lg font-semibold">🎪 Travel/Carnival Ad Placeholder</h3>
                </div>
            </div>
            
            <SectionSeparator />
            
            {/* 4. ENTERTAINMENT GUIDES */}
            <div className="px-4 mt-8">
                <h2 className="text-2xl font-bold mb-4">ENTERTAINMENT GUIDES</h2>
                <div className="grid grid-cols-2 gap-4">
                    {guideItems.map(guide => (
                        <div 
                            key={guide} 
                            className="h-[80px] bg-gray-100 border border-gray-300 rounded-lg shadow flex items-center justify-center text-center p-2 text-sm font-semibold cursor-pointer hover:bg-gray-200"
                            onClick={() => alert(`Navigating to ${guide}`)}
                        >
                            {guide}
                        </div>
                    ))}
                </div>
            </div>

            <SectionSeparator />

            {/* 5. FEATURED Section */}
            <div className="px-4 mt-8">
                <h2 className="text-2xl font-bold mb-4">FEATURED</h2>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div className="h-[100px] sm:h-[140px] relative overflow-hidden rounded-lg shadow-lg">
                        <img src="https://images.unsplash.com/photo-1542315809-548773998b5a?w=400&h=100&fit=crop" alt="Hotels" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/30 flex items-center justify-center"><span className="text-white font-bold">Hotels</span></div>
                    </div>
                    <div className="h-[100px] sm:h-[140px] relative overflow-hidden rounded-lg shadow-lg">
                        <img src="https://images.unsplash.com/photo-1563290940-a35948332997?w=400&h=100&fit=crop" alt="Ticket Deals" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/30 flex items-center justify-center"><span className="text-white font-bold">Ticket Deals</span></div>
                    </div>
                    <div className="h-[100px] sm:h-[140px] relative overflow-hidden rounded-lg shadow-lg">
                        <img src="https://images.unsplash.com/photo-1588661642845-f09d273c52e1?w=400&h=100&fit=crop" alt="VIP Packages" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/30 flex items-center justify-center"><span className="text-white font-bold">VIP Packages</span></div>
                    </div>
                    <div className="h-[100px] sm:h-[140px] relative overflow-hidden rounded-lg shadow-lg">
                        <img src="https://images.unsplash.com/photo-1517048676732-5178f28d82f7?w=400&h=100&fit=crop" alt="Sell on TM" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/30 flex items-center justify-center"><span className="text-white font-bold">Sell on TM</span></div>
                    </div>
                </div>
            </div>
        </div>
    );
};

// --- New Dedicated Search Page Component ---
const SearchPage = ({ setView }) => (
    <div className="min-h-screen bg-white">
        {/* Search Header Bar */}
        <div className="p-3 flex items-center border-b tm-bg-dark-blue">
            <button onClick={() => setView('home')} className="p-1 text-white mr-3">
                <ChevronLeft size={24} />
            </button>
            <div className="w-full bg-white rounded-lg flex items-center p-2">
                <div className="flex-1 min-w-0 pl-2">
                    <input 
                        type="text"
                        placeholder="Artist, Event or Venue"
                        className="w-full text-gray-700 text-base placeholder-gray-500 focus:outline-none"
                        autoFocus
                    />
                </div>
                <Search size={24} className="tm-primary-blue flex-shrink-0" />
            </div>
        </div>
        
        {/* Search Content Body */}
        <div className="p-4">
            <h3 className="text-lg font-bold mb-3">Trending Searches</h3>
            <ul className="space-y-2">
                {['Taylor Swift', 'NBA Finals', 'Concerts Tonight', 'Comedians'].map((term) => (
                    <li key={term} className="text-gray-700 p-2 border-b border-gray-100 cursor-pointer hover:bg-gray-50">
                        {term}
                    </li>
                ))}
            </ul>
        </div>
    </div>
);

// --- Mobile Navigation Bar ---
const MobileNavBar = ({ currentView, setView }) => {
    const navItems = [
        { label: "Home", icon: TicketIcon, view: "home" },
        // Added Search to the bottom bar for easy access
        { label: "Search", icon: Search, view: "search" }, 
        { label: "Favorites", icon: Heart, view: "favorites" },
        { label: "Account", icon: User, view: "account" },
    ];

    return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 shadow-xl">
            <div className="flex justify-around items-center h-16">
                {navItems.map((item) => {
                    const isActive = currentView === item.view;
                    return (
                        <button
                            key={item.label}
                            onClick={() => setView(item.view)}
                            className="flex flex-col items-center justify-center p-1 text-xs font-semibold w-1/4"
                        >
                            <item.icon size={20} className={isActive ? 'tm-primary-blue' : 'text-gray-500'} />
                            <span className={`mt-0.5 ${isActive ? 'tm-primary-blue' : 'text-gray-500'}`}>
                                {item.label}
                            </span>
                        </button>
                    );
                })}
            </div>
        </div>
    );
};

// --- View Placeholder Components ---
const CartPage = () => <div className="p-8 text-center min-h-screen">
    <ShoppingCart size={48} className="tm-primary-blue mx-auto mb-4" />
    <h2 className="text-2xl font-bold tm-dark-blue">Your Cart</h2>
    <p className="text-gray-600 mt-2">No items in your cart yet. Find an event to get started!</p>
</div>;
const FavoritesPage = () => <div className="p-8 text-center min-h-screen">
    <Heart size={48} className="text-red-500 mx-auto mb-4" />
    <h2 className="text-2xl font-bold tm-dark-blue">My Favorites</h2>
    <p className="text-gray-600 mt-2">Tap the heart icon on any event to save it here.</p>
</div>;
const AccountPage = () => <div className="p-8 text-center min-h-screen">
    <User size={48} className="tm-primary-blue mx-auto mb-4" />
    <h2 className="text-2xl font-bold tm-dark-blue">Account Settings</h2>
    <p className="text-gray-600 mt-2">Manage your profile, payment, and notifications here.</p>
</div>;
const MyTicketsPage = () => <div className="p-8 text-center min-h-screen">
    <TicketIcon size={48} className="tm-primary-blue mx-auto mb-4" />
    <h2 className="text-2xl font-bold tm-dark-blue">My Events & Tickets</h2>
    <p className="text-gray-600 mt-2">Your confirmed and past tickets will appear here.</p>
</div>;

// --- Detail Page Component ---
const DetailPage = ({ event }) => {
    if (!event) return <div className="p-8 text-center min-h-screen">Event not found.</div>;
    
    // Simple date formatting
    const formattedDate = new Date(event.date).toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });

    return (
        <div className="min-h-screen pb-20">
            <header className="relative h-64 overflow-hidden shadow-lg">
                <img src={event.banner} alt={event.title} className="w-full h-full object-cover" />
                <div className="absolute inset-0 bg-black/40"></div>
                <div className="absolute bottom-0 left-0 p-4 text-white">
                    <p className="text-sm uppercase font-semibold text-gray-300">{event.genre}</p>
                    <h1 className="text-3xl font-bold mt-1">{event.title}</h1>
                </div>
            </header>

            <div className="p-4 bg-white">
                {/* Date, Time, Location */}
                <div className="flex items-center space-x-4 mb-4">
                    <div className="flex items-center space-x-2 text-gray-700">
                        <Calendar size={20} className="tm-primary-blue" />
                        <span className="font-semibold">{formattedDate} @ {event.time}</span>
                    </div>
                </div>

                <div className="flex items-center space-x-2 text-gray-700 mb-6">
                    <MapPin size={20} className="tm-primary-blue" />
                    <span className="font-semibold">{event.venue}, {event.location}</span>
                </div>
                
                {/* Action Buttons */}
                <div className="flex space-x-3 mb-6">
                    <button className="tm-btn flex-1 flex items-center justify-center space-x-2" onClick={() => alert('Proceeding to checkout')}>
                        <TicketIcon size={20} />
                        <span>Tickets from ${event.price}</span>
                    </button>
                    <button className="p-3 bg-gray-100 rounded-full text-gray-600 hover:bg-gray-200 transition" onClick={() => alert('Added to favorites')}>
                        <Heart size={20} />
                    </button>
                </div>

                <h2 className="text-xl font-bold mt-8 mb-3">About the Event</h2>
                <p className="text-gray-700 leading-relaxed">
                    {event.description}
                </p>

                <h2 className="text-xl font-bold mt-8 mb-3">Ticket Information</h2>
                <div className="border p-4 rounded-lg bg-gray-50">
                    <p className="text-gray-700">
                        <span className="font-bold">Available:</span> {event.availableTickets} tickets remaining.
                    </p>
                    <p className="text-gray-700 mt-1">
                        <span className="font-bold">Price Range:</span> Starts at ${event.price}.
                    </p>
                    {event.isRequested && (
                        <p className="text-red-500 font-semibold mt-2">
                            This is a high-demand event. Prices may fluctuate.
                        </p>
                    )}
                </div>
            </div>
        </div>
    );
};


// --- Main Application Component ---
const App = () => {
    const [currentView, setCurrentView] = useState('home'); 
    const [selectedEvent, setSelectedEvent] = useState(null);
    const [isNavOpen, setIsNavOpen] = useState(false);
    const [isLoggedIn, setIsLoggedIn] = useState(false);
    const [filterCategory, setFilterCategory] = useState(null);

    const setView = (view, category = null) => {
        setCurrentView(view);
        setFilterCategory(category);
    };

    const toggleNav = () => {
        setIsNavOpen(!isNavOpen);
    };
    
    // Filter events if a category filter is active
    const filteredEvents = useMemo(() => {
        if (!filterCategory || currentView !== 'home') {
            return initialEvents;
        }
        return initialEvents.filter(event => event.category === filterCategory);
    }, [filterCategory, currentView]);

    const renderContent = () => {
        switch (currentView) {
            case 'detail':
                return <DetailPage event={selectedEvent} />;
            case 'cart':
                return <CartPage />;
            case 'favorites':
                return <FavoritesPage />;
            case 'account':
                return <AccountPage />;
            case 'mytickets':
                return <MyTicketsPage />;
            case 'search':
                return <SearchPage setView={setView} />;
            case 'home':
            default:
                return <HomePage 
                    events={filterCategory ? filteredEvents : initialEvents} 
                    setView={setView} 
                    setSelectedEvent={setSelectedEvent} 
                />;
        }
    };

    return (
        <div className="min-h-screen bg-gray-100 relative">
            {/* Navigation Panel - Renders on top of everything when open */}
            <NavigationPanel 
                show={isNavOpen} 
                onClose={() => setIsNavOpen(false)} 
                setView={setView} 
                isLoggedIn={isLoggedIn}
                setIsLoggedIn={setIsLoggedIn}
            />

            {/* Header (No longer sticky) */}
            <HomeHeader 
                setView={setView} 
                toggleNav={toggleNav} 
                isLoggedIn={isLoggedIn} 
            />

            {/* Main Content Area */}
            <main className="pb-16">
                {renderContent()}
            </main>

            {/* Mobile Bottom Navigation Bar (Fixed at the bottom) */}
            <MobileNavBar 
                currentView={currentView} 
                setView={setView} 
            />
        </div>
    );
};

// --- Initialization ---
const rootContainer = document.getElementById('root');
if (rootContainer && ReactDOM.createRoot) {
    const root = ReactDOM.createRoot(rootContainer);
    root.render(<App />);
} else {
    // Fallback for older React version (unlikely needed with CDN 18.2.0)
    ReactDOM.render(<App />, rootContainer);
}
</script>
</body>
</html>
